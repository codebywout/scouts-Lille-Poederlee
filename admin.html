<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/scouts.png">
    <link rel="apple-touch-icon" href="assets/images/scouts.png">
    <meta name="robots" content="noindex, nofollow">
    <title>Beheer | Scouts Lille-Poederlee</title>
    <meta name="description" content="Beheerpagina voor de Scouts Lille-Poederlee website.">
    <link rel="stylesheet" href="assets/css/style.css?v=20261015-19">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="admin-page">
    <header class="navbar admin-navbar">
        <div class="nav-inner admin-nav-inner">
            <a href="/" class="brand" aria-label="Scouts Lille-Poederlee home">
                <img class="brand-logo" src="assets/images/scouts.png" alt="Scouts Lille-Poederlee logo">
            </a>

            <div class="admin-toolbar" role="toolbar" aria-label="Beheeracties">
                <a href="/" class="admin-tool-btn admin-tool-btn--site">
                    <span class="admin-tool-icon" aria-hidden="true">←</span>
                    <span class="admin-tool-label admin-tool-label--full">Terug naar site</span>
                    <span class="admin-tool-label admin-tool-label--short">Site</span>
                </a>
                <button type="button" class="admin-tool-btn admin-tool-btn--settings admin-settings-button" data-page-option="settings" aria-pressed="false">
                    <span class="admin-tool-icon" aria-hidden="true">⚙</span>
                    <span class="admin-tool-label admin-tool-label--full">Instellingen</span>
                    <span class="admin-tool-label admin-tool-label--short">Instel.</span>
                </button>
                <button type="button" id="logoutBtn" class="admin-tool-btn admin-tool-btn--logout">
                    <span class="admin-tool-icon" aria-hidden="true">⎋</span>
                    <span class="admin-tool-label admin-tool-label--full">Uitloggen</span>
                    <span class="admin-tool-label admin-tool-label--short">Uit</span>
                </button>
            </div>
        </div>
    </header>

    <main class="admin-shell">
        <form id="adminForm" class="admin-form">
            <div class="page-picker">
                <section class="page-picker-group" aria-labelledby="sitePickerLabel">
                    <h2 class="page-picker-label" id="sitePickerLabel">Site</h2>
                    <div class="page-picker-grid">
                        <button type="button" class="page-picker-tile is-active" data-page-option="home" role="radio" aria-checked="true">Home</button>
                        <button type="button" class="page-picker-tile" data-page-option="news" role="radio" aria-checked="false">Nieuws</button>
                        <button type="button" class="page-picker-tile" data-page-option="over-ons" role="radio" aria-checked="false">Over ons</button>
                        <button type="button" class="page-picker-tile" data-page-option="inschrijven" role="radio" aria-checked="false">Inschrijven</button>
                        <button type="button" class="page-picker-tile" data-page-option="photos" role="radio" aria-checked="false">Foto's</button>
                        <button type="button" class="page-picker-tile" data-page-option="secondhand" role="radio" aria-checked="false">Tweedehands</button>
                    </div>
                </section>
                <section class="page-picker-group" aria-labelledby="branchPickerLabel">
                    <h2 class="page-picker-label" id="branchPickerLabel">Takken</h2>
                    <div class="page-picker-grid">
                        <button type="button" class="page-picker-tile" data-page-option="kapoenen" role="radio" aria-checked="false">Kapoenen</button>
                        <button type="button" class="page-picker-tile" data-page-option="welpen" role="radio" aria-checked="false">Welpen</button>
                        <button type="button" class="page-picker-tile" data-page-option="jongverkenners" role="radio" aria-checked="false">Jongverkenners</button>
                        <button type="button" class="page-picker-tile" data-page-option="verkenners" role="radio" aria-checked="false">Verkenners</button>
                        <button type="button" class="page-picker-tile" data-page-option="jins" role="radio" aria-checked="false">Jins</button>
                    </div>
                </section>
            </div>

            <div id="pageEditor" class="admin-grid" aria-live="polite"></div>

            <div class="save-row">
                <a id="viewLivePage" class="admin-view-live" href="/" target="_blank" rel="noopener noreferrer">Bekijk op de site</a>
                <button type="submit" id="saveChanges" class="button button-primary">
                    <span class="save-button-label save-button-label-idle">Wijzigingen opslaan</span>
                    <span class="save-button-label save-button-label-saving" aria-hidden="true">
                        <span class="save-button-spinner" aria-hidden="true"></span>
                        <span>Opslaan...</span>
                    </span>
                    <span class="save-button-label save-button-label-done" aria-hidden="true">
                        <span class="save-button-check" aria-hidden="true">✓</span>
                        <span>Opgeslagen</span>
                    </span>
                </button>
                <span id="saveStatus" aria-live="polite"></span>
            </div>
        </form>
    </main>

    <script src="assets/js/script.js?v=20261015-19"></script>
</body>
</html>
